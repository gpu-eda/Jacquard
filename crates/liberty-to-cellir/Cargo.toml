[package]
name = "liberty-to-cellir"
version = "0.3.0-rc.5"
edition = "2021"
description = "Build/CI-time tool that generates a cell-model-IR descriptor from a Liberty library (ADR 0019, D6). Lives outside the root cargo package; `cargo test` from the repo root does NOT run its tests — use `cargo test --manifest-path crates/liberty-to-cellir/Cargo.toml`. Not depended on by jacquard core."
license = "Apache-2.0"
repository = "https://github.com/gpu-eda/Jacquard"
publish = false

[lib]
path = "src/lib.rs"

# The CLI is gated behind the (default-on) `cli` feature so build-time
# consumers — notably Jacquard's `build.rs`, which links this crate as a
# library to generate bundled descriptors (ADR 0019 D7) — can depend on it
# with `default-features = false` and skip the `clap` build cost.
[[bin]]
name = "liberty-to-cellir"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde_json = "1.0"
cell-model-ir = { path = "../cell-model-ir" }
liberty-parse = { path = "../liberty-parse" }
cell-decomp = { path = "../cell-decomp" }
