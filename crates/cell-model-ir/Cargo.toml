[package]
name = "cell-model-ir"
version = "0.3.0-rc.1"
edition = "2021"
description = "Jacquard cell-model IR: a generated, JSON-first, per-cell-type library descriptor (pin directions, combinational AIG, sequential/classification, timing). See docs/adr/0019-cell-model-ir.md."
license = "Apache-2.0"
repository = "https://github.com/gpu-eda/Jacquard"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "cell-model-ir-diff"
path = "src/bin/cell-model-ir-diff.rs"

[dependencies]
# JSON-first on-disk form (D2): diff-able, inspectable, no flatc dependency.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CLI parsing for cell-model-ir-diff. Matches the derive style used in jacquard.
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
