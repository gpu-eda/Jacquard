[package]
# Registry/package name. Renamed from "jacquard" (which is an unrelated,
# actively-published crates.io crate — an AT-Protocol client library) so
# `cargo install` / `cargo binstall` resolve unambiguously and never fall back
# to building that other project. The library and binary targets below keep the
# `jacquard` name, so the binary users run, the release asset, and every
# `use jacquard::…` in the source are unchanged.
name = "jacquard-sim"
version = "0.3.0-rc.4"
edition = "2021"
description = "GPU-accelerated RTL logic simulator with vector-driven setup/hold timing analysis. Maps gate-level netlists to a virtual manycore Boolean processor and runs them on Metal / CUDA / HIP."
repository = "https://github.com/gpu-eda/Jacquard"
homepage = "https://chipflow.io"
keywords = ["rtl", "simulation", "gpu", "timing", "eda"]
categories = ["simulation", "hardware-support"]
license = "Apache-2.0"
links = "jacquard"

# cargo-binstall: fetch a prebuilt release binary instead of building
# from source (ADR 0018). Only macOS/Metal is unambiguous by target
# triple; Linux has two GPU backends (CUDA/HIP) for one triple, so it is
# NOT binstall-able — use the release tarball or container directly.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/jacquard-{ version }-macos-arm64-metal.tar.gz"

[dependencies]
cachedhash = "0.2.0"
cell-decomp = { path = "crates/cell-decomp" }
cell-model-ir = { path = "crates/cell-model-ir" }
clap = { version = "4.5.15", features = ["derive"] }
clilog = { version = "0.2.5", path = "vendor/eda-infra-rs/clilog" }
compact_str = "0.7.1"
indexmap = { version = "2.4.0", features = ["rayon"] }
itertools = "0.13.0"
liberty-parse = { path = "crates/liberty-parse" }
mt-kahypar = "0.2.0"
netlistdb = { version = "0.4.6", path = "vendor/eda-infra-rs/netlistdb" }
opensta-to-ir = { path = "crates/opensta-to-ir" }
rand = "0.8.5"
rand_chacha = "0.3.1"
rayon = "1.10.0"
serde = { version = "1.0.208", features = ["derive"] }
smallvec = "1.13"
elf = "0.7"
serde_bare = "0.5.0"
serde_json = "1.0"
sverilogparse = { version = "0.4.2", path = "vendor/eda-infra-rs/sverilogparse" }
tempdir = "0.3.7"
toml = "0.8"
timing-ir = { path = "crates/timing-ir" }
ulib = { version = "0.3.13", path = "vendor/eda-infra-rs/ulib" }
vcd-ng = { version = "0.2.0", path = "vendor/eda-infra-rs/vcd-ng" }
anyhow = "1"
log = "0.4"
# `synth` feature only (ADR 0021): run YoWASP Yosys (WASM) in-process for
# `jacquard build`. Pure-Rust, cross-platform; heavy to compile, so opt-in.
wasmtime = { version = "37", optional = true, default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = { version = "37", optional = true }
# `synth` feature only (ADR 0021 Phase 2 / A2): fetch + verify + unpack the pinned
# provenance-carrying yosys.wasm from a Jacquard release on first use. `ureq` is a
# small blocking HTTP client (rustls, no OpenSSL); `zip` unpacks the YoWASP wheel
# (the exact CI artifact — deterministic sha256, published by a CI runner).
ureq = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }

[build-dependencies]
ucc = { version = "0.2.5", path = "vendor/eda-infra-rs/ucc" }
cc = "1.0"
# ADR 0019 D7: bundled cell-model-IR descriptors are generated at build time
# from the pinned vendored PDKs (NOT checked in). build.rs links the converter
# as a library (no CLI/clap) and writes descriptors into OUT_DIR for
# `include_str!`.
liberty-to-cellir = { path = "crates/liberty-to-cellir", default-features = false }
cell-model-ir = { path = "crates/cell-model-ir" }

[features]
cuda = ["ulib/cuda"]
hip = ["ulib/hip"]
metal = ["ulib/metal", "dep:metal", "dep:objc", "dep:block"]
# ADR 0021: `jacquard build` behavioral-RTL on-ramp (embedded YoWASP Yosys).
# Opt-in because wasmtime+cranelift materially increases compile time; release
# binaries enable it. GPU features are orthogonal.
synth = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:ureq", "dep:sha2", "dep:zip"]

[dependencies.metal]
version = "0.29"
optional = true

[dependencies.objc]
version = "0.2"
optional = true

[dependencies.block]
version = "0.1"
optional = true

[lib]
# Keep the library crate name `jacquard` (independent of the package name
# above) so every `use jacquard::…` in src/bin and tests stays untouched.
name = "jacquard"

[[bin]]
name = "jacquard"

[dev-dependencies]
criterion = "0.5"
flatbuffers = "25"
tempfile = "3"

[[bench]]
name = "event_buffer"
harness = false

[[bench]]
name = "xprop"
harness = false
