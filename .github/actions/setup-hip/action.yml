name: Setup HIP (NVIDIA backend)
description: >
  Install the CUDA toolkit + ROCm/HIP for compiling the HIP backend lowered onto
  NVIDIA (HIP_PLATFORM=nvidia). hip-runtime-nvidia pulls NVIDIA driver packages,
  so the HIP .debs are downloaded and force-installed individually to bypass
  driver dep conflicts. Build-time only — the HIP-on-NVIDIA test binary needs
  just cudart at run time (use setup-cuda with runtime-only). This action is the
  seam that a future real-AMD (HIP_PLATFORM=amd, ROCm) setup would slot beside.
runs:
  using: composite
  steps:
    # HIP-on-NVIDIA lowers onto the CUDA runtime, so the toolkit install is
    # identical to the CUDA build — reuse setup-cuda rather than duplicating the
    # keyring + toolkit + env block.
    - name: Setup CUDA toolkit
      uses: ./.github/actions/setup-cuda

    - name: Install ROCm/HIP (NVIDIA backend)
      shell: bash
      run: |
        # Import ROCm GPG signing key
        wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key | sudo apt-key add -
        sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 9386B48A1A693C5C 2>/dev/null || true
        # Add ROCm repo
        CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [arch=amd64] https://repo.radeon.com/rocm/apt/6.2.4 ${CODENAME} main" | \
          sudo tee /etc/apt/sources.list.d/rocm.list
        sudo apt-get update
        # hip-runtime-nvidia pulls nvidia driver packages; download the HIP
        # .deb files individually and force-install, bypassing driver dep
        # conflicts.
        DLDIR=$(mktemp -d)
        pushd "$DLDIR"
        for pkg in hip-runtime-nvidia hip-dev hipcc-nvidia rocm-core; do
          echo "Downloading ${pkg}..."
          sudo apt-get download "$pkg" 2>&1 || echo "  (skipped: $pkg not available)"
        done
        echo "Downloaded packages:"
        ls -la *.deb 2>/dev/null || { echo "ERROR: No .deb files downloaded!"; exit 1; }
        sudo dpkg --force-depends --force-conflicts -i *.deb
        popd
        /opt/rocm/bin/hipcc --version
        echo "PATH=/opt/rocm/bin:$PATH" >> "$GITHUB_ENV"
        echo "HIP_PLATFORM=nvidia" >> "$GITHUB_ENV"
        echo "HIP_COMPILER=nvcc" >> "$GITHUB_ENV"
        echo "HIP_RUNTIME=cuda" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=/opt/rocm/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=/opt/rocm/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
