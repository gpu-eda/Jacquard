name: Release

# Builds prebuilt binaries and attaches them to a GitHub Release.
# See ADR 0018 and docs/plans/distribution.md.
#
# - Tagging `v<X.Y.Z>` builds, smoke-tests, and publishes the release with the
#   macOS/Metal binary attached (or attaches it to an existing release of that
#   tag). Notes come from the matching CHANGELOG section.
# - `workflow_dispatch` is a dry-run: it builds, packages, smoke-tests,
#   and uploads the tarball as a workflow artifact — no release created.
#
# `netlist-graph` (PyPI) ships from a separate workflow on
# `netlist-graph-v*` tags, so this `v*` trigger never collides with it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-metal:
    name: Release binary (macOS / Metal)
    runs-on: macos-runner-1
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init required submodules
        run: git submodule update --init vendor/eda-infra-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (OpenMP for the Metal build)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install llvm
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${LLVM_PREFIX}/lib/c++:${LLVM_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Determine version / mode
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            # Verify-guard: the three first-party Rust crates must all carry
            # the tagged version (see docs/release-process.md). Aborts the
            # release before any publish if a version bump was missed.
            python3 scripts/bump_version.py --check "${tag_ver}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag_ver}" >> "$GITHUB_OUTPUT"
            # A SemVer pre-release suffix (e.g. 0.2.2-rc.1) marks a staging
            # release candidate — publish it as a GitHub *prerelease* so it
            # never shows as "Latest". Validate it with validate-install.yml,
            # then promote by cutting the final tag. See docs/release-process.md.
            if [[ "${tag_ver}" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Dry-run: assert the crates agree and reuse their shared version
            # (bump_version.py is the single TOML parser — no grep/sed re-derive).
            ver=$(python3 scripts/bump_version.py --print-version)
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=${ver}-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build jacquard + timing_analysis (Metal) + opensta-to-ir
        run: |
          # timing_analysis is the jacquard package's *other* bin; cargo
          # binstall requires every non-optional package bin to be in the
          # archive, so it must ship alongside jacquard (it builds without the
          # metal feature, but one invocation keeps the build cache shared).
          # `synth` (ADR 0021): embeds YoWASP Yosys so the shipped binary accepts
          # behavioral RTL directly (`jacquard sim design.v`). The ~39 MB yosys.wasm
          # is not bundled yet — auto-fetch is Phase 4; until then the on-ramp needs
          # `--yosys-wasm` / an installed `yowasp-yosys`. A pre-synthesized netlist
          # works with no wasm.
          cargo build --release --features metal,synth --bin jacquard --bin timing_analysis
          cargo build --release --manifest-path crates/opensta-to-ir/Cargo.toml --bin opensta-to-ir

      - name: Package
        id: package
        run: |
          set -euo pipefail
          PKG="jacquard-${{ steps.meta.outputs.version }}-macos-arm64-metal"
          mkdir -p "stage/${PKG}"
          cp target/release/jacquard "stage/${PKG}/"
          cp target/release/timing_analysis "stage/${PKG}/"
          cp crates/opensta-to-ir/target/release/opensta-to-ir "stage/${PKG}/"
          cp LICENSE README.md CHANGELOG.md "stage/${PKG}/"
          # Binaries at the archive root → matches the cargo-binstall
          # `bin-dir = "{ bin }{ binary-ext }"` in Cargo.toml.
          tar -czf "${PKG}.tar.gz" -C "stage/${PKG}" \
            jacquard timing_analysis opensta-to-ir LICENSE README.md CHANGELOG.md
          shasum -a 256 "${PKG}.tar.gz" | tee "${PKG}.tar.gz.sha256"
          echo "tarball=${PKG}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${PKG}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: User-acceptance smoke (relocated tarball; docs/installation.md § Verify)
        # Unpack the release tarball like a user would and run the documented
        # install-verification flow (jacquard --version, sim, cosim) against the
        # *relocated* binaries — no build tree, so it catches relocatability
        # regressions. Shared with the standalone user-acceptance workflow.
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/relocate"
          rm -rf "$dest" && mkdir -p "$dest"
          tar -C "$dest" -xzf "${{ steps.package.outputs.tarball }}"
          bash scripts/ci/user_acceptance_smoke.sh "$dest" "${GITHUB_WORKSPACE}"

      - name: Extract release notes from CHANGELOG
        if: steps.meta.outputs.is_release == 'true'
        id: notes
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.version }}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "no [$ver] section in CHANGELOG; using auto-generated notes" >&2
            echo "AUTO=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUTO=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release + attach binary
        if: steps.meta.outputs.is_release == 'true'
        id: gh_release
        # softprops uses GITHUB_TOKEN via the API — no `gh` CLI, which isn't on
        # PATH on the self-hosted macos-runner-1 (the old `gh release create`
        # died with "gh: command not found", so v0.1.0/v0.2.0 shipped with no
        # binary). Creates the release if missing, or attaches the asset to an
        # existing one (e.g. re-running a tag whose release was cut by hand).
        #
        # This repo has immutable releases enabled, so assets can't be added
        # after a release is published. A final release uploads-then-publishes
        # atomically (draft:false works). A prerelease, though, is published on
        # creation and the asset upload is then rejected — so prereleases are
        # created as a *draft* (mutable) here and published in the next step.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          body_path: notes.md
          generate_release_notes: ${{ steps.notes.outputs.AUTO == 'true' }}
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}

      - name: Publish the prerelease draft (immutable-releases repo)
        # The prerelease was created as a draft so the binary could attach;
        # flip it to published now (assets are already in place). Final
        # releases skip this — they publish directly above.
        if: steps.meta.outputs.is_release == 'true' && steps.meta.outputs.is_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${{ steps.gh_release.outputs.id }}" \
            -d '{"draft": false}' -o /dev/null

      - name: Upload dry-run artifact
        if: steps.meta.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.tarball }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}
