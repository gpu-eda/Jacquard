name: Release

# Builds prebuilt binaries and attaches them to a GitHub Release.
# See ADR 0018 and docs/plans/distribution.md.
#
# - Tagging `v<X.Y.Z>` builds, smoke-tests, and publishes the release with the
#   macOS/Metal binary attached (or attaches it to an existing release of that
#   tag). Notes come from the matching CHANGELOG section.
# - `workflow_dispatch` is a dry-run: it builds, packages, smoke-tests,
#   and uploads the tarball as a workflow artifact — no release created.
#
# `netlist-graph` (PyPI) ships from a separate workflow on
# `netlist-graph-v*` tags, so this `v*` trigger never collides with it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-metal:
    name: Release binary (macOS / Metal)
    runs-on: macos-runner-1
    env:
      GH_TOKEN: ${{ github.token }}
    # Expose the version/mode decision so the tap-bump job can gate on it.
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init required submodules
        run: git submodule update --init vendor/eda-infra-rs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM (OpenMP for the Metal build)
        run: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install llvm
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${LLVM_PREFIX}/lib/c++:${LLVM_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Determine version / mode
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            # Verify-guard: the three first-party Rust crates must all carry
            # the tagged version (see docs/release-process.md). Aborts the
            # release before any publish if a version bump was missed.
            python3 scripts/bump_version.py --check "${tag_ver}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag_ver}" >> "$GITHUB_OUTPUT"
            # A SemVer pre-release suffix (e.g. 0.2.2-rc.1) marks a staging
            # release candidate — publish it as a GitHub *prerelease* so it
            # never shows as "Latest". Validate it with validate-install.yml,
            # then promote by cutting the final tag. See docs/release-process.md.
            if [[ "${tag_ver}" == *-* ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Dry-run: assert the crates agree and reuse their shared version
            # (bump_version.py is the single TOML parser — no grep/sed re-derive).
            ver=$(python3 scripts/bump_version.py --print-version)
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=${ver}-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Build jacquard + timing_analysis (Metal) + opensta-to-ir
        run: |
          # timing_analysis is the jacquard package's *other* bin; cargo
          # binstall requires every non-optional package bin to be in the
          # archive, so it must ship alongside jacquard (it builds without the
          # metal feature, but one invocation keeps the build cache shared).
          # `synth` (ADR 0021): embeds YoWASP Yosys so the shipped binary accepts
          # behavioral RTL directly (`jacquard sim design.v`). The ~39 MB yosys.wasm
          # is not bundled yet — auto-fetch is Phase 4; until then the on-ramp needs
          # `--yosys-wasm` / an installed `yowasp-yosys`. A pre-synthesized netlist
          # works with no wasm.
          cargo build --release --features metal,synth --bin jacquard --bin timing_analysis
          cargo build --release --manifest-path crates/opensta-to-ir/Cargo.toml --bin opensta-to-ir

      - name: Package
        id: package
        run: |
          set -euo pipefail
          PKG="jacquard-${{ steps.meta.outputs.version }}-macos-arm64-metal"
          mkdir -p "stage/${PKG}"
          cp target/release/jacquard "stage/${PKG}/"
          cp target/release/timing_analysis "stage/${PKG}/"
          cp crates/opensta-to-ir/target/release/opensta-to-ir "stage/${PKG}/"
          cp LICENSE README.md CHANGELOG.md "stage/${PKG}/"
          # Binaries at the archive root → matches the cargo-binstall
          # `bin-dir = "{ bin }{ binary-ext }"` in Cargo.toml.
          tar -czf "${PKG}.tar.gz" -C "stage/${PKG}" \
            jacquard timing_analysis opensta-to-ir LICENSE README.md CHANGELOG.md
          shasum -a 256 "${PKG}.tar.gz" | tee "${PKG}.tar.gz.sha256"
          echo "tarball=${PKG}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${PKG}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: User-acceptance smoke (relocated tarball; docs/installation.md § Verify)
        # Unpack the release tarball like a user would and run the documented
        # install-verification flow (jacquard --version, sim, cosim) against the
        # *relocated* binaries — no build tree, so it catches relocatability
        # regressions. Shared with the standalone user-acceptance workflow.
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/relocate"
          rm -rf "$dest" && mkdir -p "$dest"
          tar -C "$dest" -xzf "${{ steps.package.outputs.tarball }}"
          bash scripts/ci/user_acceptance_smoke.sh "$dest" "${GITHUB_WORKSPACE}"

      - name: Extract release notes from CHANGELOG
        if: steps.meta.outputs.is_release == 'true'
        id: notes
        env:
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.version }}"
          extract() {
            awk -v ver="$1" '
              $0 ~ "^## \\[" ver "\\]" {flag=1; next}
              flag && /^## \[/ {flag=0}
              flag {print}
            ' CHANGELOG.md
          }
          extract "$ver" > notes.md || true
          # Prereleases (X.Y.Z-rc.N) have no dated [X.Y.Z-rc.N] section — their
          # entries live under [Unreleased] during the RC window — so fall back
          # to it, giving RC releases the curated draft notes for review.
          if [ ! -s notes.md ] && [ "${IS_PRERELEASE}" = "true" ]; then
            echo "no [$ver] section; prerelease → using [Unreleased] draft notes" >&2
            extract "Unreleased" > notes.md || true
          fi
          # Version-pin doc links: rewrite `docs/foo.md` refs to the mdBook page
          # published for THIS release (docs-version job deploys to gh-pages
          # /<tag>/). Produces a clickable [docs/foo.md](…/<tag>/foo.html).
          # Portable across GNU + BSD (macOS runner) sed: no `-i` (BSD needs a
          # suffix arg) — write to a temp file; `bt` is a literal backtick from
          # printf, kept out of the raw shell to avoid command substitution.
          if [ -s notes.md ]; then
            bt=$(printf '\140')
            sed -E \
              "s#${bt}docs/([A-Za-z0-9/_-]+)\.md${bt}#[docs/\1.md](https://gpu-eda.github.io/Jacquard/${TAG}/\1.html)#g" \
              notes.md > notes.md.tmp && mv notes.md.tmp notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "no matching CHANGELOG section; using auto-generated notes" >&2
            echo "AUTO=true" >> "$GITHUB_OUTPUT"
          else
            echo "AUTO=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release + attach binary
        if: steps.meta.outputs.is_release == 'true'
        id: gh_release
        # softprops uses GITHUB_TOKEN via the API — no `gh` CLI, which isn't on
        # PATH on the self-hosted macos-runner-1 (the old `gh release create`
        # died with "gh: command not found", so v0.1.0/v0.2.0 shipped with no
        # binary). Creates the release if missing, or attaches the asset to an
        # existing one (e.g. re-running a tag whose release was cut by hand).
        #
        # This repo has immutable releases enabled, so assets can't be added
        # after a release is published. A final release uploads-then-publishes
        # atomically (draft:false works). A prerelease, though, is published on
        # creation and the asset upload is then rejected — so prereleases are
        # created as a *draft* (mutable) here and published in the next step.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          body_path: notes.md
          generate_release_notes: ${{ steps.notes.outputs.AUTO == 'true' }}
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}

      - name: Publish the prerelease draft (immutable-releases repo)
        # The prerelease was created as a draft so the binary could attach;
        # flip it to published now (assets are already in place). Final
        # releases skip this — they publish directly above.
        if: steps.meta.outputs.is_release == 'true' && steps.meta.outputs.is_prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${{ steps.gh_release.outputs.id }}" \
            -d '{"draft": false}' -o /dev/null

      - name: Upload dry-run artifact
        if: steps.meta.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.tarball }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha }}

  # Auto-bump the Homebrew formula in the tap so `brew install` tracks releases
  # without a manual edit (the tap had been drifting — stale at 0.2.3). Final
  # releases push to the production tap; prereleases push to a separate
  # prerelease tap so RCs are `brew install`-able for staging without polluting
  # the stable channel. See docs/release-process.md § Homebrew.
  #
  # Requires (org-admin one-time setup):
  #   - secrets.HOMEBREW_TAP_TOKEN — a fine-grained PAT / App token with
  #     `contents: write` on both tap repos below.
  #   - the gpu-eda/homebrew-tap-prerelease repo (for the RC channel).
  bump-tap:
    name: Bump Homebrew tap
    needs: release-metal
    # Real tags only (skip workflow_dispatch dry-runs).
    if: needs.release-metal.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the formula template
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Generate the bumped formula from the published asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          tarball="jacquard-${ver}-macos-arm64-metal.tar.gz"
          # Read the sha256 the release job published alongside the tarball.
          # Retry on transient errors too — a just-published release asset can
          # 404 briefly while GitHub propagates the download URL.
          sha="$(curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors "${base}/${tarball}.sha256" | awk '{print $1}')"
          test -n "${sha}"
          # Rewrite the source-of-truth template's url/version/sha256 from the
          # actual asset (identical mechanism to validate-install.yml).
          sed -e "s|url \".*\"|url \"${base}/${tarball}\"|" \
              -e "s|version \".*\"|version \"${ver}\"|" \
              -e "s|sha256 \".*\"|sha256 \"${sha}\"|" \
              packaging/homebrew/jacquard.rb > /tmp/jacquard.rb
          echo "--- generated formula ---"; cat /tmp/jacquard.rb
      - name: Push to the tap (production or prerelease channel)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.release-metal.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set — provision it to enable tap auto-bump." >&2
            exit 1
          fi
          if [ "${IS_PRERELEASE}" = "true" ]; then
            tap_repo="gpu-eda/homebrew-tap-prerelease"
          else
            tap_repo="gpu-eda/homebrew-tap"
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${tap_repo}.git" tap
          mkdir -p tap/Formula
          cp /tmp/jacquard.rb tap/Formula/jacquard.rb
          cd tap
          git config user.name "jacquard-release-bot"
          git config user.email "noreply@github.com"
          git add Formula/jacquard.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${TAG}; nothing to push."
            exit 0
          fi
          git commit -m "jacquard ${TAG#v}"
          git push
          echo "Pushed jacquard ${TAG#v} to ${tap_repo}."

  # Publish a frozen copy of the docs for this release to gh-pages /<tag>/, so
  # the release notes can link to version-pinned mdBook pages (the site root
  # tracks main / "latest"). `keep_files: true` on both this deploy and the
  # main-branch deploy (ci.yml) means version subdirs accumulate without
  # wiping each other. Runs for real tags only (skips workflow_dispatch
  # dry-runs, whose ref is a branch); independent of the binary build.
  docs-version:
    name: Publish versioned docs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install mdbook
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build mdbook
        run: mdbook build
      - name: Deploy versioned docs to gh-pages /<tag>/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          destination_dir: ${{ github.ref_name }}
          keep_files: true

      # Must run after the deploy above: the list is derived from the published
      # directories, so the new one has to exist first. Skips release candidates
      # on its own — their docs are published but stay out of the picker.
      - name: Refresh the docs version list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/refresh_doc_versions.sh
