name: CI

# Thin orchestrator for the build → test pipeline (see
# docs/plans/ci-build-test-split.md):
#   changes → build.yml (compile artifacts on standard runners)
#           → test.yml  (run the batch against the artifacts on the right runners)
#   docs                (mdBook + Pages deploy, runs regardless of code changes)
#
# build.yml and test.yml are reusable (on: workflow_call); release.yml can reuse
# build.yml to publish the same artifacts. Keeping them as separate workflow
# files that run as jobs within THIS run means cross-workflow artifacts flow and
# PR gating stays intact.

on:
  push:
    branches: [main, staged-aig-release]
    # No paths-ignore: docs-only pushes must still trigger so the `docs` job
    # deploys the mdBook. Heavy code/GPU jobs skip per-job via `changes`.
  # No base-branch filter: run CI on every PR regardless of its base, so stacked
  # PRs (based on other feature branches) get CI automatically.
  pull_request:
  # Required for the merge queue: the queue validates each entry by firing
  # `merge_group`, and every check `main` requires must run here or an entry sits
  # in the queue forever waiting for a status that can never arrive.
  merge_group:
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded in-progress runs for the same ref so rapid pushes don't pile
# up on the billed GPU + macOS runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-queue run. The queue is blocking on these checks, and a
  # cancelled check reports as failed — which evicts the PR from the queue rather
  # than merely delaying it. PR and push runs stay cancellable: superseding them
  # is the point.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect whether anything outside docs/ and markdown changed. The build/test
  # workflows are gated on `code == 'true'`, so a docs-only PR skips them — and a
  # *skipped* required check counts as passing for branch protection, avoiding
  # the deadlock a workflow-level paths-ignore would cause. `docs` stays ungated.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      # A merge-queue entry is a candidate `main`, and the filter has no
      # meaningful base to diff against there. Run everything rather than trust
      # it: the failure mode of over-running is wasted CI, while a mis-based
      # filter would *skip tests on the commit about to become main*.
      code: ${{ github.event_name == 'merge_group' && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'merge_group'
        id: filter
        with:
          # `every`: a changed file counts toward `code` only if it matches ALL
          # patterns — i.e. it is not documentation by any of the measures below.
          #
          # This is a denylist of doc paths, not an allowlist of code paths, and
          # deliberately so: a doc path missing here only wastes CI, whereas a
          # code path missing from an allowlist would *silently skip the tests*.
          # mdBook's theme/ and book.toml are inputs to the `docs` job alone, so
          # a change to either must not drag in the GPU builds. Add to this list
          # when documentation grows a new home outside docs/.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!theme/**'
              - '!book.toml'

  # Compile every target config on a cheap standard runner and upload one
  # artifact per config (jacquard-{cpu,cuda,hip,metal}).
  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml

  # Run the test batch against the prebuilt artifacts. Always invoked (so a
  # FAILED build surfaces as failed test checks rather than silently-passing
  # skips); the code/build gating happens per-job inside test.yml via the inputs.
  test:
    name: Test
    needs: [changes, build]
    if: always()
    uses: ./.github/workflows/test.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      build_result: ${{ needs.build.result }}
    secrets: inherit

  # Build documentation (cargo doc + mdbook) and deploy to GitHub Pages. Ungated
  # so docs-only pushes still refresh the published site.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Init required submodules
        run: git submodule update --init vendor/eda-infra-rs vendor/sky130_fd_sc_hd

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          # Registry/git + the installed tool binaries (mdbook/d2 land in
          # ~/.cargo/bin). sccache owns compiled artifacts, so target/ is not
          # cached here — see setup-sccache.
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-docs-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-sccache-

      # cargo doc compiles the dependency graph, including mt-kahypar's -O3 C++.
      - name: Setup sccache
        uses: ./.github/actions/setup-sccache

      - name: Build cargo docs
        run: cargo doc --no-deps --lib

      - name: Install mdbook
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin

      - name: Install d2 + mdbook-d2 (architecture diagrams)
        # The docs render ```d2 fenced blocks to SVG at build time. mdbook-d2
        # shells out to the `d2` binary, so both must be present. Install d2 from
        # its release tarball into ~/.cargo/bin (already on PATH, same pattern as
        # mdbook above) rather than the install script, whose target dir isn't
        # guaranteed on PATH. The preprocessor comes from crates.io.
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          install /tmp/d2-v0.7.1/bin/d2 ~/.cargo/bin/d2
          cargo install mdbook-d2 --version 0.3.8 --locked

      - name: Build mdbook
        run: mdbook build

      - name: Check for broken / 404-ing doc links
        # Validates links against the *rendered* mdBook page set (SUMMARY.md),
        # catching links to pages that exist on disk but aren't rendered (which
        # 404 on the published site). See docs/scripts/check_doc_links.py.
        run: python3 docs/scripts/check_doc_links.py

      - name: Prepare Pages site
        run: |
          cp -r target/doc book/api
          touch book/.nojekyll

      - name: Deploy to gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
          # 'latest' docs stay at the site root (existing URLs unaffected).
          # keep_files preserves the per-release /vX.Y.Z/ subdirs that
          # release.yml publishes — a plain deploy would wipe them.
          keep_files: true
          # docs/scripts/ is documentation *tooling*, so it lives under docs/ to
          # stay out of the code path-filter — but mdbook copies every non-md
          # file in src/ into the book, so drop it at the deploy rather than
          # serving a gh-pages push script on the docs site. ('.github' is
          # peaceiris's own default, restated because setting this replaces it.)
          exclude_assets: '.github,scripts'

      # Keeps the version picker's list in step with what's published. Also here
      # (not only in release.yml) so the list is right after any merge, and so
      # it bootstraps without waiting for the next release.
      - name: Refresh the docs version list
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash docs/scripts/refresh_doc_versions.sh
