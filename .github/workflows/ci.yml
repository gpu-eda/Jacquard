name: CI

# Thin orchestrator for the build → test pipeline (see
# docs/plans/ci-build-test-split.md):
#   changes → build.yml (compile artifacts on standard runners)
#           → test.yml  (run the batch against the artifacts on the right runners)
#   docs                (mdBook + Pages deploy, runs regardless of code changes)
#
# build.yml and test.yml are reusable (on: workflow_call); release.yml can reuse
# build.yml to publish the same artifacts. Keeping them as separate workflow
# files that run as jobs within THIS run means cross-workflow artifacts flow and
# PR gating stays intact.

on:
  push:
    branches: [main, staged-aig-release]
    # No paths-ignore: docs-only pushes must still trigger so the `docs` job
    # deploys the mdBook. Heavy code/GPU jobs skip per-job via `changes`.
  # No base-branch filter: run CI on every PR regardless of its base, so stacked
  # PRs (based on other feature branches) get CI automatically.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded in-progress runs for the same ref so rapid pushes don't pile
# up on the billed GPU + macOS runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect whether anything outside docs/ and markdown changed. The build/test
  # workflows are gated on `code == 'true'`, so a docs-only PR skips them — and a
  # *skipped* required check counts as passing for branch protection, avoiding
  # the deadlock a workflow-level paths-ignore would cause. `docs` stays ungated.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `every`: a changed file counts toward `code` only if it matches ALL
          # patterns — i.e. NOT under docs/ AND NOT a markdown file.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'

  # Compile every target config on a cheap standard runner and upload one
  # artifact per config (jacquard-{cpu,cuda,hip,metal}).
  build:
    name: Build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml

  # Run the test batch against the prebuilt artifacts. Always invoked (so a
  # FAILED build surfaces as failed test checks rather than silently-passing
  # skips); the code/build gating happens per-job inside test.yml via the inputs.
  test:
    name: Test
    needs: [changes, build]
    if: always()
    uses: ./.github/workflows/test.yml
    with:
      code: ${{ needs.changes.outputs.code }}
      build_result: ${{ needs.build.result }}
    secrets: inherit

  # Build documentation (cargo doc + mdbook) and deploy to GitHub Pages. Ungated
  # so docs-only pushes still refresh the published site.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          submodules: vendor/eda-infra-rs vendor/sky130_fd_sc_hd
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-
      - name: Build cargo docs
        run: cargo doc --no-deps --lib
      - name: Install mdbook
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.44/mdbook-v0.4.44-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin
      - name: Build mdbook
        run: mdbook build
      - name: Check for broken / 404-ing doc links
        run: python3 scripts/check_doc_links.py
      - name: Prepare Pages site
        run: |
          cp -r target/doc book/api
          touch book/.nojekyll
      - name: Deploy to gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book
