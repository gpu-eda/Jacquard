name: Publish netlist-graph

# Publishes the `netlist-graph` Python companion tool to PyPI (ADR 0018).
#
# - Tagging `netlist-graph-v<X.Y.Z>` builds and publishes to PyPI via
#   trusted publishing (OIDC — no stored token).
# - `workflow_dispatch` is a dry-run: it builds + uploads the wheel as a
#   workflow artifact but does NOT publish.
#
# The `v*` (Rust binary) release workflow uses a different tag prefix, so
# the two never collide.
#
# Setup required once on PyPI: configure a trusted publisher for project
# `netlist-graph` → owner `gpu-eda`, repo `Jacquard`, workflow
# `publish-netlist-graph.yml`, environment `pypi`. See packaging/README.md.

on:
  push:
    tags:
      - 'netlist-graph-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: astral-sh/setup-uv@v4

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#netlist-graph-v}"
          pkg_ver=$(grep -m1 '^version' scripts/netlist_graph/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$tag_ver" != "$pkg_ver" ]; then
            echo "tag version ($tag_ver) != pyproject version ($pkg_ver)" >&2
            exit 1
          fi

      - name: Build
        run: uv build --package netlist-graph --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: netlist-graph-dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Real tags only — the workflow_dispatch dry-run stops after build.
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netlist-graph-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
