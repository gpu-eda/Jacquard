# Spike probe (docs/spikes/amd-laptop-backend.md): can we emit HIP code for the
# AMD *laptop* targets at all?
#
# `ucc::cl_hip()` defaults to ["gfx1030", "gfx1100"] — both discrete. We have
# never compiled for gfx1103 (Phoenix), gfx1150 (Strix Point) or gfx1151 (Strix
# Halo), which is why our CI runner works (it reports gfx1030) and a laptop
# wouldn't. `UCC_HIP_TARGETS` overrides the list.
#
# Compiling is necessary, not sufficient — the goldens still have to pass on real
# laptop silicon, and no runner we have can stand in (ours is gfx1030, a
# different ROCm support tier). But it's the free half of the answer, and it
# either kills or confirms the case for a portable-compute backend.
#
# The runner is gfx1030, so it also re-runs the goldens: adding targets must not
# change behaviour on the arch we already support.
#
# Temporary — delete once the spike concludes.
name: HIP laptop-arch probe

on:
  push:
    branches: [spike/amd-laptop-backend]
  workflow_dispatch:

jobs:
  compile:
    name: Compile HIP kernel for laptop archs
    runs-on: [self-hosted, amd, rocm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Init required submodules
        run: git submodule update --init vendor/eda-infra-rs vendor/sky130_fd_sc_hd

      # The image ships Rust at /opt/cargo, but it isn't writable by the runner
      # user — cargo then dies with "failed to create directory
      # /opt/cargo/registry/cache: Permission denied". Point CARGO_HOME at the
      # workspace instead.
      - name: Toolchain
        run: |
          export PATH=/opt/rocm/bin:$PATH
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"
          hipcc --version | head -3
          hipconfig --platform
          cargo --version

      # The question. gfx1103 = Phoenix/Hawk Point, gfx1150 = Strix Point,
      # gfx1151 = Strix Halo. All RDNA3/3.5 and therefore wave32, which is what
      # kernel_v1.hip.cpp requires. hipcc cross-compiles; the GPUs need not be
      # present.
      - name: Build --features hip for discrete + laptop archs
        env:
          UCC_HIP_TARGETS: gfx1030,gfx1100,gfx1103,gfx1150,gfx1151
        run: |
          export PATH=/opt/rocm/bin:$PATH
          echo "::notice::UCC_HIP_TARGETS=$UCC_HIP_TARGETS"
          # No pipe here: `cargo ... | tail` masks cargo's exit status behind
          # tail's, so a failed build reports success.
          cargo build -r --features hip --bin jacquard

      - name: Which archs actually landed in the binary?
        continue-on-error: true
        run: |
          export PATH=/opt/rocm/bin:$PATH
          echo "::group::roc-obj / offload bundle"
          # The clang offload bundler records one entry per --offload-arch.
          if command -v roc-obj-ls >/dev/null; then
            roc-obj-ls target/release/jacquard 2>&1 | head -12 || true
          fi
          # Fallback: the arch strings are embedded in the fat binary.
          for a in gfx1030 gfx1100 gfx1103 gfx1150 gfx1151; do
            if strings target/release/jacquard 2>/dev/null | grep -q "$a"; then
              echo "  present: $a"
            else
              echo "  MISSING: $a"
            fi
          done
          echo "::endgroup::"

      # This runner is gfx1030. Adding targets must not change behaviour on the
      # arch we already ship, so the goldens are the check.
      - name: Goldens still pass on gfx1030 (no regression from extra targets)
        run: |
          export PATH=/opt/rocm/bin:$PATH
          JACQUARD_BIN=target/release/jacquard COSIM_SCOPE=all \
            bash scripts/ci/cosim_cpu_check.sh
