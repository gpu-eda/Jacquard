name: Build

# Reusable build workflow: compile the jacquard binary for each target
# configuration on a cheap standard runner and upload it as an artifact for the
# test workflow (and, later, for release publishing). One artifact per config:
#   jacquard-cpu      (no GPU backend)   — ubuntu, for the CPU-only test config
#   jacquard-cuda     (--features cuda)  — ubuntu, all-major SASS
#   jacquard-hip-rocm (--features hip)   — ubuntu, inside a ROCm container
#   jacquard-metal    (--features metal) — macos, Metal
# `synth` (the RTL on-ramp) is uniform on every artifact.
#
# Every config builds on a standard runner — no self-hosted GPU box builds
# anything. The AMD/ROCm binary is the one that can't be produced by a plain
# `apt` toolchain, so its build runs inside the official `rocm/dev-ubuntu-24.04`
# container (pinned to 7.2.4, matching the self-hosted AMD runner's runtime).
# hipcc cross-compiles the gfx code objects with no GPU present; the binary is
# then downloaded and run on the real AMD hardware by the `amd` test job. This
# is HIP_PLATFORM=amd (real ROCm), NOT the old HIP-over-CUDA path.
#
# The cuda + hip artifacts are separate today; ulib already supports both
# backends in one binary (Device is an additive runtime enum), so they can later
# collapse into one fat cuda,hip artifact by editing this matrix — no workflow
# reshape. See docs/plans/ci-build-test-split.md.

on:
  workflow_call:
    inputs:
      retention-days:
        description: Artifact retention in days (release publishing may want longer).
        type: number
        required: false
        default: 1

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    # Empty for host jobs; the ROCm image only for the hip-rocm config. GitHub
    # treats an empty `container:` as "run on the host".
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: cpu
            runner: ubuntu-latest
            features: synth
            submodules: vendor/eda-infra-rs vendor/sky130_fd_sc_hd vendor/gf180mcu_fd_sc_mcu7t5v0 vendor/gf180mcu_fd_sc_mcu9t5v0
          - config: cuda
            runner: ubuntu-22.04
            features: cuda,synth
            submodules: vendor/eda-infra-rs vendor/sky130_fd_sc_hd
          - config: hip-rocm
            runner: ubuntu-latest
            # Real ROCm toolchain, version-matched to the AMD runner (7.2.4).
            container: rocm/dev-ubuntu-24.04:7.2.4
            features: hip,synth
            submodules: vendor/eda-infra-rs vendor/sky130_fd_sc_hd
          - config: metal
            runner: macos-latest
            features: metal,synth
            submodules: vendor/eda-infra-rs vendor/sky130_fd_sc_hd vendor/gf180mcu_fd_sc_mcu7t5v0 vendor/gf180mcu_fd_sc_mcu9t5v0
    steps:
      # The ROCm container is a bare devel image: it has hipcc but not the tools
      # actions/checkout, rust-toolchain, and cc need. Install them before the
      # first action runs. No-op (skipped) on the host-based configs.
      - name: Container prerequisites (ROCm image)
        if: matrix.container != ''
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl build-essential
          # The container runs as root but the checked-out workspace is owned by
          # the runner UID, so git refuses it as "dubious ownership". checkout
          # marks its own tree safe, but the init-submodules step's raw git
          # commands need this too. Persists in /root/.gitconfig for later steps.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Init submodules
        uses: ./.github/actions/init-submodules
        with:
          submodules: ${{ matrix.submodules }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup CUDA toolkit
        if: matrix.config == 'cuda'
        uses: ./.github/actions/setup-cuda

      - name: Setup Metal toolchain
        if: matrix.config == 'metal'
        uses: ./.github/actions/setup-metal

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Per-config key so the divergent dependency trees (wasmtime for synth,
          # cust for cuda, …) don't thrash a shared cache. LLVM_VERSION is only
          # set for the metal build; empty elsewhere.
          key: ${{ runner.os }}-cargo-build-${{ matrix.config }}-llvm${{ env.LLVM_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.config }}-

      - name: Build jacquard
        env:
          # all-major SASS + PTX (needs CUDA >= 12.8 for Blackwell) for the
          # distributed cuda binary. Ignored by the non-cuda configs (the cuda
          # block in build.rs is cfg'd out), so the empty value is harmless.
          JACQUARD_CUDA_ARCH: ${{ matrix.config == 'cuda' && 'all-major' || '' }}
        run: cargo build --release --features ${{ matrix.features }} --bin jacquard

      - name: Upload jacquard-${{ matrix.config }}
        uses: actions/upload-artifact@v7
        with:
          name: jacquard-${{ matrix.config }}
          path: target/release/jacquard
          retention-days: ${{ inputs.retention-days }}
