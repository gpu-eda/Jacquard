self-hosted-runner:
  labels:
    - nvidia-runner-1
    - macos-runner-1
    # GitHub-hosted GPU larger runner (gpu-eda team plan), added 2026-06-05.
    # A custom-named larger runner, so actionlint needs it listed.
    # (macos-latest-xlarge is a standard GitHub label — actionlint already
    # knows it, so it doesn't go here.)
    - tesla4-runner
    # Self-hosted Blackwell (sm_120) runner on nvidia1.local, added 2026-06-30.
    # Targeted as `runs-on: [self-hosted, cuda, blackwell]`; `self-hosted` is a
    # standard label, these two are custom.
    - cuda
    - blackwell
    - sm_120
    # Self-hosted AMD ROCm runner (gfx1036 — RDNA2 integrated GPU), registered
    # at org level. Targeted as `runs-on: [self-hosted, amd, rocm]`. Until now
    # nothing referenced it: `HIP Tests (NVIDIA backend)` builds against
    # hip-runtime-nvidia and runs on tesla4-runner, so HIP had never executed on
    # AMD hardware — the open "HIP CI on the AMD runner" item in
    # docs/release-process.md.
    - amd
    - rocm
    - gfx1036
