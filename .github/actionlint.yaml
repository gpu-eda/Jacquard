self-hosted-runner:
  labels:
    - nvidia-runner-1
    - macos-runner-1
    # GitHub-hosted GPU larger runner (gpu-eda team plan), added 2026-06-05.
    # A custom-named larger runner, so actionlint needs it listed.
    # (macos-latest-xlarge is a standard GitHub label — actionlint already
    # knows it, so it doesn't go here.)
    - tesla4-runner
    # Self-hosted Blackwell (sm_120) runner on nvidia1.local, added 2026-06-30.
    # Targeted as `runs-on: [self-hosted, cuda, blackwell]`; `self-hosted` is a
    # standard label, these two are custom.
    - cuda
    - blackwell
    - sm_120
    # Self-hosted AMD ROCm runner, registered at org level and targeted as
    # `runs-on: [self-hosted, amd, rocm]` by `HIP Tests (ROCm backend)`.
    #
    # The `gfx1036` label is wrong: the hardware reports **gfx1030** (RDNA2
    # discrete-class, on ROCm's main compatibility matrix — a different support
    # tier from any laptop APU). Left as-is because the label is set at
    # registration, not here; see docs/spikes/amd-laptop-backend.md.
    - amd
    - rocm
    - gfx1036
