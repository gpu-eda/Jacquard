self-hosted-runner:
  labels:
    - nvidia-runner-1
    - macos-runner-1
    # GitHub-hosted GPU larger runner (gpu-eda team plan), added 2026-06-05.
    # A custom-named larger runner, so actionlint needs it listed.
    # (macos-latest-xlarge is a standard GitHub label — actionlint already
    # knows it, so it doesn't go here.)
    - tesla4-runner
    # Self-hosted Blackwell (sm_120) runner on nvidia1.local, added 2026-06-30.
    # Targeted as `runs-on: [self-hosted, cuda, blackwell]`; `self-hosted` is a
    # standard label, these two are custom.
    - cuda
    - blackwell
    - sm_120
    # Self-hosted AMD ROCm runner, registered at org level and targeted as
    # `runs-on: [self-hosted, amd, rocm]` by `HIP Tests (ROCm backend)`.
    #
    # The `gfx1036` label is correct: the runner is the Raphael iGPU integrated
    # into nvidia1's Ryzen 5 7600 (PCI 1002:164e, RDNA2). ROCm reports `gfx1030`
    # only because the `amd-runner` image sets HSA_OVERRIDE_GFX_VERSION=10.3.0 —
    # it is the report that is spoofed, not the label.
    #
    # So the runner is an APU rather than a discrete card, which makes it a
    # closer proxy for an AMD laptop. See docs/spikes/amd-laptop-backend.md.
    - amd
    - rocm
    - gfx1036

# Suppress two shellcheck patterns in test.yml that are intentional, not bugs.
# Scoped to this one file so every other workflow keeps full shellcheck coverage
# (SC2086 in particular catches real unquoted-variable bugs elsewhere).
#   SC2046: `make -j$(nproc)` — nproc emits a single integer, so the flagged
#           word-splitting can't happen; this is the idiomatic parallel-make form.
#   SC2086: unquoted `$TIMING_ARGS` — deliberately word-split so an empty value
#           passes no args and a set value passes the flag+path as two args.
paths:
  .github/workflows/test.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2046'
      - 'shellcheck reported issue in this script: SC2086'
